[workspace]
members = [
  "crates/hermes-spa-decoder",
  "crates/ndarray-spa-plugin",
  "crates/nuvu-spa-plugin",
  "crates/pipewireao-spa-node",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
cc = "1.4.4"
libc = "0.2.189"
libspa = { package = "libspa-ao", git = "https://github.com/DarrylGamroth/PipeWireAO-rs.git", rev = "0897f4137df53cf89f19fda1d6233f434c931b5b", features = ["v1_2_0"] }
pkg-config = "0.3.34"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
