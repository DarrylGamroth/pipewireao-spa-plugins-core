# Dedicated daemon-owned COPY queue; external clients own only their streams.
context.properties = {
    core.daemon = true
    core.name = pipewireao-queue-remote-test
    library.use-fallback = true
    module.rt = false
    module.profiler = false
    context.data-loops = [
        { thread.name = queue-capture loop.class = data.rt loop.rt-prio = 0 }
        { thread.name = queue-playback loop.class = data.rt loop.rt-prio = 0 }
    ]
}
context.spa-libs = { support.* = support/libspa-support }
context.modules = [
    { name = libpipewire-module-scheduler-v1 }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-link-factory args = { allow.link.passive = true } }
    { name = libpipewire-module-queue
      args = {
        metadata = [ { type = 768 size = 40 required = false } { type = 769 size = 64 required = false } { type = 770 size = 336 required = false } { type = 771 size = 8 required = false } { type = 772 size = 8 required = false } ]
        queue.max-buffers = 1
        queue.overflow = drop-oldest
        queue.storage = copy
        queue.media = application/ndarray
        capture.props = { node.name = test.remote-queue-input node.loop.name = queue-capture }
        playback.props = { node.name = test.remote-queue-output node.loop.name = queue-playback }
      }
    }
]
